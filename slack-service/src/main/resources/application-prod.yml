spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/logistics?currentSchema=slack_service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
slack:
  base-url: https://slack.com/api
  bot-token: ${SLACK_BOT_TOKEN}