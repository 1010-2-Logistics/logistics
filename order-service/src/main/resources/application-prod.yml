spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/logistics?currentSchema=order_service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
