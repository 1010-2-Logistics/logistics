spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/logistics?currentSchema=ai_service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

rabbitmq:
  order-created:
    exchange: order.exchange
    queue: order-created.queue
    
    dlx: ai.dead-letter.exchange
    dlq: order-created.dlq
    dlq-routing-key: order-created.dead

  slack:
    exchange: slack.exchange
    queue: slack.send.queue
    routing-key: slack.send

ai:
  gemini:
    url: https://generativelanguage.googleapis.com/v1beta/models
    key: ${GEMINI_KEY}