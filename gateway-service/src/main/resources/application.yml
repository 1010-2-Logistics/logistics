server:
  # 외부 요청이 가장 먼저 들어오는 Gateway 포트
  port: 19091

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    # Eureka에 등록될 서비스 이름
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          # Eureka 서비스 이름을 외부 URL에 노출하는 자동 라우팅은 사용하지 않음
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

          # 외부 요청 경로와 내부 서비스를 직접 연결
          routes:
            - id: user-service

              # lb는 LoadBalancer를 의미
              # Eureka에서 template-service의 실행 위치를 조회해 요청을 전달
              uri: lb://user-service

              predicates:
                - Path=/v3/api-docs/user-service
              filters:
                - SetPath=/v3/api-docs

            - id: hub-service
              uri: lb://hub-service
              predicates:
                - Path=/v3/api-docs/hub-service
              filters:
                - SetPath=/v3/api-docs

            - id: hubRoute-service
              uri: lb://hubRoute-service
              predicates:
                - Path=/v3/api-docs/hubRoute-service
              filters:
                - SetPath=/v3/api-docs

            - id: company-service
              uri: lb://company-service
              predicates:
                - Path=/v3/api-docs/company-service
              filters:
                - SetPath=/v3/api-docs

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/v3/api-docs/product-service
              filters:
                - SetPath=/v3/api-docs

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/v3/api-docs/order-service
              filters:
                - SetPath=/v3/api-docs

            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/v3/api-docs/inventory-service
              filters:
                - SetPath=/v3/api-docs

            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                - Path=/v3/api-docs/delivery-service
              filters:
                - SetPath=/v3/api-docs

            - id: slack-service
              uri: lb://slack-service
              predicates:
                - Path=/v3/api-docs/slack-service
              filters:
                - SetPath=/v3/api-docs

            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/v3/api-docs/ai-service
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - { name: user, url: /v3/api-docs/user-service }
      - { name: hub, url: /v3/api-docs/hub-service }
      - { name: hubRoute, url: /v3/api-docs/hubRoute-service }
      - { name: company, url: /v3/api-docs/company-service }
      - { name: product, url: /v3/api-docs/product-service }
      - { name: order, url: /v3/api-docs/order-service }
      - { name: inventory, url: /v3/api-docs/inventory-service }
      - { name: delivery, url: /v3/api-docs/delivery-service }
      - { name: slack, url: /v3/api-docs/slack-service }
      - { name: ai, url: /v3/api-docs/ai-service }

jwt:
  # user-service와 동일한 값이어야 서명 검증이 성립한다
  secret: ${JWT_SECRET}
  whitelist:
    - /api/v1/auth/login
    - /api/v1/auth/signup
    - /actuator/health
    - /swagger-ui
    - /v3/api-docs
    - /swagger-resources
    - /webjars

eureka:
  client:
    service-url:
      # Gateway가 접속할 Eureka Server 주소
      defaultZone: http://localhost:19090/eureka/

  instance:
    # 호스트명 대신 IP 주소를 Eureka에 등록
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  tracing:
    sampling:
      probability: 1.0

  endpoints:
    web:
      exposure:
        # 상태 확인용 Actuator 엔드포인트 공개
        include: health,info,gateway

  endpoint:
    gateway:
      # Gateway 라우트 조회만 허용
      # 운영에서도 unrestricted보다 read-only가 안전
      access: read-only

    health:
      # 상세 상태 정보 표시
      show-details: always