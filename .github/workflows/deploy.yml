name: Deploy

on:
  push:
    branches: [main]

# OIDC로 임시 자격증명을 받기 위해 필요하다. 롱리브드 액세스 키는 쓰지 않는다.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 116971679055.dkr.ecr.ap-northeast-2.amazonaws.com/logistics
  APP_INSTANCE_ID: i-0890295aa0f457bcb
  DEPLOY_ROLE_ARN: arn:aws:iam::116971679055:role/logistics-github-actions-deploy

jobs:
  build-and-deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 12개 모듈을 빌드하고 12개 이미지를 만든다.
      - name: Build jars
        run: ./gradlew build -x test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build and push images
        run: |
          set -euo pipefail
          # 이미지명 : Dockerfile 디렉터리 (hubRoute-service만 대소문자가 다르다 —
          # 모듈 디렉터리는 hubRoute-service, ECR 리포/이미지명은 hubroute-service)
          declare -A DOCKERFILE_DIR=(
            [eureka-server]=eureka-server
            [gateway-service]=gateway-service
            [user-service]=user-service
            [hub-service]=hub-service
            [hubroute-service]=hubRoute-service
            [company-service]=company-service
            [product-service]=product-service
            [order-service]=order-service
            [inventory-service]=inventory-service
            [delivery-service]=delivery-service
            [slack-service]=slack-service
            [ai-service]=ai-service
          )
          for svc in "${!DOCKERFILE_DIR[@]}"; do
            dir="${DOCKERFILE_DIR[$svc]}"
            docker build -f "$dir/Dockerfile" \
              -t "${{ env.ECR_REGISTRY }}/$svc:latest" \
              -t "${{ env.ECR_REGISTRY }}/$svc:${{ github.sha }}" \
              .
            docker push "${{ env.ECR_REGISTRY }}/$svc:latest"
            docker push "${{ env.ECR_REGISTRY }}/$svc:${{ github.sha }}"
          done

      # EC2에는 .env와 docker-compose.app.yml만 올라가 있고 저장소 체크아웃이 없다.
      # 배포 스크립트만 보내면 compose 변경(서비스 추가, 환경변수 변경)이 반영되지
      # 않으므로 매 배포마다 파일을 덮어쓴다. 따옴표로 감싼 heredoc 구분자를 써서
      # compose 안의 ${...} 자리표시자가 EC2 셸에서 치환되지 않게 한다.
      - name: Sync compose file to EC2
        run: |
          set -euo pipefail
          jq -Rs '{commands: [("cat > /home/ec2-user/logistics/docker-compose.app.yml <<'"'"'COMPOSE_EOF'"'"'\n" + . + "COMPOSE_EOF")]}' \
            docker-compose.app.yml > /tmp/ssm-compose.json

          SYNC_ID=$(aws ssm send-command \
            --instance-ids "${{ env.APP_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "sync compose ${{ github.sha }}" \
            --parameters file:///tmp/ssm-compose.json \
            --query "Command.CommandId" --output text)

          for i in $(seq 1 30); do
            SYNC_STATUS=$(aws ssm get-command-invocation \
              --command-id "$SYNC_ID" --instance-id "${{ env.APP_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$SYNC_STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          if [ "$SYNC_STATUS" != "Success" ]; then
            echo "compose sync status: $SYNC_STATUS"
            aws ssm get-command-invocation \
              --command-id "$SYNC_ID" --instance-id "${{ env.APP_INSTANCE_ID }}" \
              --query "StandardErrorContent" --output text
            exit 1
          fi

      # SSH 키를 시크릿에 두지 않기 위해 SSM Send-Command로 배포한다.
      # 실제 스크립트는 infra/scripts/deploy-app.sh — 12개를 한 번에 올리지 않고
      # eureka → gateway → 3개씩 3배치 → ai 순으로 기동한다(Phase 6과 동일한 이유).
      # 헬스체크도 App EC2 안(localhost)에서 수행한다 — app-sg의 19091은 본인
      # IP로만 열려 있어 GitHub Actions 러너 IP에서는 애초에 접근할 수 없다.
      - name: Deploy via SSM and health-check
        run: |
          set -euo pipefail
          jq -Rs '{commands: [.]}' infra/scripts/deploy-app.sh > /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.APP_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ github.sha }}" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          # aws ssm wait command-executed의 기본 타임아웃은 3배치 순차 기동 +
          # 최종 헬스체크(최악의 경우 10분 이상)보다 짧을 수 있어 직접 폴링한다.
          STATUS="InProgress"
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "${{ env.APP_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          # 잘림은 SSM 쪽에서 일어나므로 여기서 tail을 해도 이미 잘린 내용의 뒷부분일
          # 뿐이다. 근본 대책은 deploy-app.sh의 pull --quiet이고, 이건 러너 로그를
          # 읽기 좋게 줄이는 용도다.
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "${{ env.APP_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text | tail -n 100

          if [ "$STATUS" != "Success" ]; then
            echo "SSM deploy command status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "${{ env.APP_INSTANCE_ID }}" \
              --query "StandardErrorContent" --output text
            exit 1
          fi
