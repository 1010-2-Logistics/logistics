spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/logistics?currentSchema=inventory_service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
internal:
  auth:
    service-key: ${INTERNAL_SERVICE_KEY}